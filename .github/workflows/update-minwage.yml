name: Update minimum wage

on:
  schedule:
    - cron: "0 0 1 * *"   # 매월 1일 00:00 UTC 자동 실행 (새 최저임금은 매년 8월경 반영됨)
  workflow_dispatch: {}    # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch & update minwage.json
        env:
          MINWAGE_API_URL: ${{ vars.MINWAGE_API_URL }}
          MINWAGE_SERVICE_KEY: ${{ secrets.MINWAGE_SERVICE_KEY }}
        run: node scripts/update-minwage.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain minwage.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add minwage.json
            git commit -m "chore: 최저임금 자동 갱신"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
